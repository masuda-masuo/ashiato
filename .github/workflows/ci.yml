name: CI

on:
  push:
  pull_request:

# The repository default is already read-only; stating it here is what the
# CodeQL actions/missing-workflow-permissions rule asks for, and it survives a
# change to that default.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The one interpreter this tool actually runs on (the WSL host).
          # requires-python still allows >=3.11 and ruff still targets py311,
          # but only this version is exercised here.
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Report collected test count
        run: |
          summary=$(python -m pytest --collect-only | tail -1)
          echo "collect-only: $summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

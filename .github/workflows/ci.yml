name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Report collected test count
        run: |
          summary=$(python -m pytest --collect-only | tail -1)
          echo "collect-only: $summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

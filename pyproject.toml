[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ashiato"
description = "Turn Claude Code session transcripts into a queryable DuckDB database."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
# ruff is pinned: an unpinned `ruff>=0.6` let 0.17.6 add a SIM102 finding on
# untouched code and turn an unrelated PR red (#123). Bump it on purpose, in its
# own change, and fix what the new version reports there.
dev = ["pytest>=8", "ruff==0.17.6"]

[project.scripts]
ashiato = "ashiato.cli:main"

[tool.hatch.version]
path = "src/ashiato/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ashiato"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
